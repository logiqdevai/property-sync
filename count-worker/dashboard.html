<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency site counter</title>
<style>

:root{
  --bg:#0a0f1e; --bg2:#0e1530; --card:#121a33; --card2:#182242; --line:rgba(255,255,255,.07);
  --text:#e9edfa; --muted:#8e99ba; --accent:#6e8bff; --accent2:#a78bfa;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --shadow:0 10px 30px rgba(0,0,0,.35); --radius:18px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f5fb; --bg2:#e9edf8; --card:#ffffff; --card2:#f1f4fc; --line:rgba(20,30,70,.09);
    --text:#141b34; --muted:#5d6788; --accent:#4a67f0; --accent2:#7c5cf0; --good:#0f9d74; --warn:#b7791f; --bad:#d64545; --info:#2b6cd6;
    --shadow:0 8px 24px rgba(30,45,110,.10); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);
  background:radial-gradient(1200px 600px at 10% -10%,var(--bg2),transparent),radial-gradient(900px 500px at 100% 0%,rgba(110,139,255,.10),transparent),var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;margin:0;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
h1 small{color:var(--muted);font-weight:500;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);position:relative}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;opacity:.0;animation:ping 1.8s ease-out infinite;color:var(--good)}
.pill.offline .dot{background:var(--bad)} .pill.offline .dot::after{color:var(--bad)}
.pill.warn .dot{background:var(--warn)} .pill.warn .dot::after{color:var(--warn)}
.pill.done .dot{background:var(--info)} .pill.done .dot::after{animation:none}
.hdrbtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill.btn{color:var(--text);text-decoration:none;cursor:pointer;border-color:var(--accent);transition:transform .15s ease,box-shadow .15s ease}
.pill.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(110,139,255,.25)}
.pill.btn:active{transform:translateY(0)}
.pill.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
@keyframes ping{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.grid{display:grid;gap:16px}
.hero{grid-template-columns:minmax(280px,380px) 1fr}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:16px}
.two{grid-template-columns:1fr 1fr;margin-top:16px}
@media (max-width:860px){.hero,.two{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
/* ring */
.ringbox{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:230px;height:230px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line);fill:none;stroke-width:14}
.ring .bar{fill:none;stroke:url(#g);stroke-width:14;stroke-linecap:round;stroke-dasharray:527.8;stroke-dashoffset:527.8;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .glow{filter:drop-shadow(0 0 8px rgba(110,139,255,.55))}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pct{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1}
.pct .sign{font-size:22px;color:var(--muted);font-weight:700;margin-left:2px}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.strip{width:100%;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.strip i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,var(--accent) 0 12px,var(--accent2) 12px 24px);background-size:34px 34px;animation:slide 1s linear infinite;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.strip.stopped i{animation:none}
@keyframes slide{to{background-position:34px 0}}
/* eta */
.eta{display:flex;flex-direction:column;gap:14px;height:100%}
.count{font-size:54px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.count .u{font-size:22px;color:var(--muted);font-weight:700;margin:0 8px 0 2px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--text);font-variant-numeric:tabular-nums}
.spark{width:100%;height:96px;display:block}
.spark .area{fill:url(#sg);opacity:.9} .spark .line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark text{fill:var(--muted);font-size:10px}
/* stat cards */
.stat .n{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
.stat .bar{height:4px;border-radius:9px;margin-top:12px;background:var(--line);overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1s ease}
.c-good i{background:var(--good)} .c-warn i{background:var(--warn)} .c-bad i{background:var(--bad)} .c-info i{background:var(--info)} .c-mut i{background:var(--muted)}
/* confidence */
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%;transition:width 1s ease}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;text-decoration:none;vertical-align:-1px}
.hl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hl .n{font-size:44px;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.hl .t{color:var(--muted);font-size:13px;max-width:34ch}
/* feed */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}
.feed li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.feed .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:800}
.ic.good{background:rgba(52,211,153,.16);color:var(--good)} .ic.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.ic.bad{background:rgba(248,113,113,.16);color:var(--bad)} .ic.mut{background:rgba(142,153,186,.16);color:var(--muted)}
.feed .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .sm{font-size:12px;color:var(--muted);margin-top:1px}
.feed .rt{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;text-align:right}
.up{color:var(--good)} .down{color:var(--bad)} .eq{color:var(--muted)}
.badge{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.badge.high{background:rgba(52,211,153,.18);color:var(--good)} .badge.medium{background:rgba(96,165,250,.18);color:var(--info)} .badge.low{background:rgba(251,191,36,.18);color:var(--warn)}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.banner{display:none;margin:0 0 14px;padding:11px 14px;border-radius:12px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:var(--bad);font-size:13px;font-weight:600}
.banner.show{display:block}
.login{max-width:420px;margin:12vh auto;text-align:center}
.login input{width:100%;padding:12px 14px;margin:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px}
.login button{padding:11px 20px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
/* pipeline overview */
.sec{margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec h2{margin:0;font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:800}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.sc{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sc h3{margin:0;font-size:15px;font-weight:700}
.sc .desc{color:var(--muted);font-size:12.5px;line-height:1.45;min-height:2.9em}
.tag{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;background:rgba(142,153,186,.16);color:var(--muted)}
.tag.run{background:rgba(52,211,153,.16);color:var(--good)} .tag.done{background:rgba(96,165,250,.16);color:var(--info)}
.tag.warn{background:rgba(251,191,36,.16);color:var(--warn)} .tag.bad{background:rgba(248,113,113,.16);color:var(--bad)}
.sbar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.sbar.run i{background:repeating-linear-gradient(45deg,var(--accent) 0 12px,var(--accent2) 12px 24px);background-size:34px 34px;animation:slide 1s linear infinite}
.sbar.done i{background:var(--good)}
.sc .nums{display:block;line-height:1.6;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sc .nums b{color:var(--text)}
.sc .note{font-size:12.5px;color:var(--muted);min-height:1.3em}
.sc .note.err{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.b{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.b:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(110,139,255,.22)} .b:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.scbar{margin:0 0 12px;padding:10px 14px;border-radius:12px;border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.10);font-size:13px;line-height:1.5}
.b.p{background:var(--accent);border-color:var(--accent);color:#fff} .b.d{border-color:rgba(248,113,113,.5);color:var(--bad)}
.how{font-size:12.5px;color:var(--muted);line-height:1.55;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.how ol{margin:4px 0 0 18px;padding:0} .how b{color:var(--text)} .how a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);z-index:99;display:none;max-width:90vw}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* tabs + step views */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 20px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;position:sticky;top:8px;z-index:20;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:inherit}
.tab:hover{color:var(--text);background:var(--card2)}
.tab.on{background:var(--accent);color:#fff}
.sd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;opacity:.55}
.sd.run{background:var(--good);opacity:1;animation:pulse 1.4s ease-in-out infinite} .sd.done{background:var(--info);opacity:1} .sd.bad{background:var(--bad);opacity:1} .sd.warn{background:var(--warn);opacity:1}
.tab.on .sd{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
#sd_overview{display:none}
@keyframes pulse{50%{opacity:.3}}
.view{display:none} .view.on{display:block;animation:in .35s ease both}
.vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 4px} .vhead h2{margin:0;font-size:19px;letter-spacing:.1px}
.vdesc{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.5}
.view .acts{margin:0 0 8px}
.view .note{font-size:13px;color:var(--muted);margin:0 0 6px;min-height:1.2em}
.view .note.err{color:var(--bad)}
.sc.click{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease} .sc.click:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(110,139,255,.2)}
.tot{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:0}
.one{grid-template-columns:1fr;margin-top:16px}
.scbar.alert{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.10);cursor:pointer}
.feed li .badge{margin-left:6px}
.speed{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--muted)}
.speed input,.speed select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit}
.speed input{width:72px}
.speed .hint{font-size:12px}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e8bff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
<div class="wrap" id="app">
  <header>
    <h1>Agency site counter <small id="sub">Spiti24 agencies · emails · property counts</small></h1>
    <div class="hdrbtns">
      <a class="pill btn" id="dl" href="#" download="spiti24-agencies.xlsx" title="The full agency list as Excel, with everything found so far">⬇ Download Excel</a>
      <div class="pill" id="pill"><span class="dot"></span><span id="pilltxt">Connecting…</span></div>
    </div>
  </header>
  <div class="banner" id="banner">Can't reach the worker right now – retrying every few seconds. The numbers below are the last ones received.</div>
  <div class="scbar" id="scratchbar" style="display:none"></div>
  <div class="scbar alert" id="alertbar" style="display:none"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="views"></div>
  <div class="toast" id="toast"></div>
  <footer id="foot">This page updates every 3 seconds · nothing on this page is stored</footer>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  try { if (token) sessionStorage.setItem('tok', token); else token = sessionStorage.getItem('tok') || ''; } catch(e){}
  if (!token) { showLogin(); return; }
  $('dl').href = '/spiti24-agencies.xlsx?token=' + encodeURIComponent(token);
  // building the Excel takes a few seconds on the server, so show progress and any error instead of a silent wait
  $('dl').addEventListener('click', function(e){
    e.preventDefault(); var b = $('dl'); if (b.dataset.busy) return;
    b.dataset.busy = '1'; b.innerHTML = '⏳ Building Excel…'; b.setAttribute('aria-disabled', 'true');
    var reset = function(){ delete b.dataset.busy; b.setAttribute('aria-disabled', 'false'); b.innerHTML = '⬇ Download Excel'; };
    fetch('/spiti24-agencies.xlsx', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' }).then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error(t || ('HTTP ' + r.status)); });
      return r.blob();
    }).then(function(blob){
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'spiti24-agencies.xlsx';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000); reset();
    }).catch(function(err){ b.innerHTML = '⚠ Failed – try again'; b.title = String(err.message).slice(0, 300); setTimeout(reset, 4000); });
  });

  function showLogin(){
    document.getElementById('app').innerHTML = '<div class="card login"><h1 style="justify-content:center">Agency site counter</h1><div class="sub">Enter the access code you were given</div>' +
      '<input id="tk" type="password" placeholder="access code" autocomplete="off"><button id="go">Open dashboard</button></div>';
    document.getElementById('go').onclick = function(){ var v = document.getElementById('tk').value.trim(); if (v) { try { sessionStorage.setItem('tok', v); } catch(e){} location.search = '?token=' + encodeURIComponent(v); } };
  }

  var RING = 2 * Math.PI * 84, shown = {}, last = null, P = null, fetchedAt = 0, failures = 0, etaBase = {};
  var lang = (navigator.language || 'en');
  // pop-up when Spiti24 blocks the collection (needs a person): asked for once, when the operator presses a collection button
  var blockedNow = false;
  function askNotify(){ try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }
  function alertBlock(at){
    var seen = ''; try { seen = localStorage.getItem('blockAlerted') || ''; } catch (e) {}
    if (seen === at) return; try { localStorage.setItem('blockAlerted', at); } catch (e) {}
    try { if ('Notification' in window && Notification.permission === 'granted') { var nb = new Notification('Spiti24 stopped the collection', { body: 'Action needed: reload the Spiti24 tab, tick “I am human”, wait a few minutes and paste the script again.', tag: 'spiti24-block', requireInteraction: true }); nb.onclick = function(){ window.focus(); nb.close(); }; } } catch (e) {}
  }
  function fmtNum(n){ return (n == null || isNaN(n)) ? '–' : Math.round(n).toLocaleString(lang); }
  function fmtDur(s){
    if (s == null || !isFinite(s)) return null; s = Math.max(0, Math.round(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return { h: h, m: m, s: x };
  }
  function durHtml(s){
    var d = fmtDur(s); if (!d) return '--';
    var out = '';
    if (d.h) out += d.h + '<span class="u">h</span>';
    if (d.h || d.m) out += String(d.m).padStart(d.h ? 2 : 1, '0') + '<span class="u">m</span>';
    out += String(d.s).padStart(2, '0') + '<span class="u">s</span>';
    return out;
  }
  function durText(s){ var d = fmtDur(s); if (!d) return '–'; return (d.h ? d.h + 'h ' : '') + (d.h || d.m ? d.m + 'm ' : '') + d.s + 's'; }
  function tween(el, to, dec){
    var key = el.id || (el.dataset.k = el.dataset.k || Math.random()); var from = shown[key] == null ? 0 : shown[key]; shown[key] = to;
    if (from === to) { el.textContent = dec ? to.toFixed(dec) : fmtNum(to); return; }
    var t0 = performance.now(), dur = 900;
    (function step(now){ var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3), v = from + (to - from) * e;
      el.textContent = dec ? v.toFixed(dec) : fmtNum(v); if (p < 1) requestAnimationFrame(step); })(t0);
  }
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  // ----- sparkline -----
  function spark(svg, vals, color, uid){
    var W = 600, H = 96, pad = 8;
    if (!vals || vals.length < 2) { svg.innerHTML = '<text x="300" y="52" text-anchor="middle">collecting data…</text>'; return; }
    var max = Math.max.apply(null, vals.concat([1])) * 1.15, n = vals.length;
    var pts = vals.map(function(v, i){ return [pad + (W - 2 * pad) * i / (n - 1), H - pad - (H - 2 * pad) * (v / max)]; });
    var line = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = line + ' L' + pts[n - 1][0].toFixed(1) + ' ' + (H - pad) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - pad) + ' Z';
    var grid = [0.25, 0.5, 0.75].map(function(f){ var y = H - pad - (H - 2 * pad) * f; return '<line class="grid" x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '"/>'; }).join('');

  function mStage(id){
    var st = P.stages[id], r = st.status === 'running', pend = st.pending || 0, tot = st.total || 0, dn = st.done || 0, unit = id === 'watermark' ? 'agencies' : 'sites';
    var tag = r ? ['Running', 'run'] : st.status === 'done' ? ['Done', 'done'] : st.status === 'error' ? ['Error', 'bad'] : (st.status === 'stopped' || st.status === 'interrupted') ? ['Stopped', 'warn'] : st.status === 'waiting' ? ['Not available', 'warn'] : (pend > 0 ? ['Ready', ''] : ['Nothing to do', '']);
    var active = r || st.status === 'done' || st.status === 'stopped' || st.status === 'interrupted';
    var ofn = active && tot ? fmtNum(dn) + ' of ' + fmtNum(tot) + ' ' + unit : (st.status === 'done' && !tot ? 'nothing to do' : fmtNum(pend) + ' waiting');
    var showNote = st.status === 'stopped' || st.status === 'interrupted' || st.status === 'waiting' || (id === 'dns' && st.status !== 'idle');
    var extra = id === 'watermark' ? 'engine: ' + (P.wmEngine === 'local' ? 'free built-in model' : P.wmEngine === 'ai' ? 'AI service (API key)' : 'none') : '';
    return { tag: tag, running: r, complete: st.status === 'done', pct: tot ? 100 * dn / tot : (st.status === 'done' ? 100 : 0), ofn: ofn, last: st.recent && st.recent[0] ? 'latest: ' + st.recent[0].name : '',
      etaSeconds: r ? st.etaSeconds : null, rate: st.perMinute, remaining: r || st.status === 'stopped' ? Math.max(0, tot - dn) : pend, elapsed: since(st.startedAt, r ? null : st.finishedAt),
      hist: st.history || [], stats: (P.stats && P.stats[id]) || [], feed: st.recent || [], emptyFeed: 'Nothing yet – press Start.',
      note: st.error ? 'Something went wrong: ' + st.error + ' — press Start to try again.' : [showNote ? st.note : '', extra].filter(Boolean).join(' · '), noteErr: st.status === 'error' };
  }
  function ownItem(r){
    var ic = r.status === 'ok' ? (r.conf === 'low' ? ['~', 'warn'] : ['✓', 'good']) : r.status === 'blocked' ? ['⛔', 'bad'] : String(r.status).indexOf('error') === 0 ? ['!', 'bad'] : ['?', 'mut'];
    var arrow = '', cls = 'eq';
    if (r.n != null) { if (r.n > r.spiti24) { arrow = '▲'; cls = 'up'; } else if (r.n < r.spiti24) { arrow = '▼'; cls = 'down'; } else { arrow = '='; } }
    return { ic: ic[0], cls: ic[1], name: r.name, badges: (r.conf ? '<span class="badge ' + r.conf + '">' + r.conf + '</span>' : '') + (r.review ? '<span class="badge low">review</span>' : ''),
      smHtml: r.n != null ? 'Spiti24 ' + fmtNum(r.spiti24) + ' → own site <b>' + fmtNum(r.n) + '</b>' : (String(r.status).indexOf('error') === 0 ? 'could not open the site (will be retried)' : esc(String(r.status).replace(/_/g, ' '))) + ' · Spiti24 ' + fmtNum(r.spiti24),
      rt: r.n != null ? arrow + ' ' + fmtNum(r.n - r.spiti24 > 0 ? r.n - r.spiti24 : r.spiti24 - r.n) : '', rtCls: cls };
  }
  function mOwn(){
    var o = P.own || {}, d = last, orun = !!o.running, done = d ? d.done : (o.done || 0), total = d ? d.total : (o.total || 0);
    var complete = !orun && total > 0 && done >= total, a = (d && d.agg) || { status: {}, conf: {} };
    var tag = orun ? ['Running', 'run'] : complete ? ['Done', 'done'] : (P.chain && P.chain.active ? ['Waiting', ''] : (o.remaining ? ['Ready', ''] : ['Nothing to do', '']));
    return { tag: tag, running: orun, complete: complete, pct: d && d.percent != null ? d.percent : (total ? 100 * done / total : 0), ofn: fmtNum(done) + ' of ' + fmtNum(total) + ' agencies',
      last: d && d.recent && d.recent[0] ? 'latest: ' + d.recent[0].name : '', etaSeconds: orun && d ? d.etaSeconds : null, rate: d ? d.sitesPerMinute : null, remaining: d ? d.remaining : (o.remaining || 0),
      elapsed: d && d.startedAtMs && orun ? (d.serverTime - d.startedAtMs) / 1000 : null, hist: (d && d.history) || [],
      stats: STAT.map(function(s){ return [s[1], a.status[s[0]] || 0, s[2], total]; }), feed: ((d && d.recent) || []).map(ownItem), emptyFeed: 'Waiting for results…', agg: a, note: '' };
  }
  function paintOwnExtras(m){
    var a = m.agg, c = a.conf || {}, COL = { high: 'var(--good)', medium: 'var(--info)', low: 'var(--warn)' };
    paintStack('own', [['High (clean sale total)', c.high, COL.high], ['Medium', c.medium, COL.medium], ['Low (estimate)', c.low, COL.low]]);
    $('own_reviewnote').innerHTML = '<b style="color:var(--text)">' + fmtNum(a.review || 0) + '</b> counts are flagged “needs review” (several different totals, or only an estimate)';
    tween($('own_over70'), a.over70 || 0); tween($('own_new70'), a.newOver70 || 0);
    paintFeed('own_new70list', ((last && last.newOver70List) || []).map(ownItem), 'None yet – they show up here as soon as one is found.');
  }

  function renderAll(){
    if (!P) return;
    var M = {}; IDS.forEach(function(id){ M[id] = id === 'collect' ? mCollect() : id === 'own' ? mOwn() : mStage(id); });
    IDS.forEach(function(id){ paintStep(id, M[id]); });
    $('how_collect').style.display = M.collect.how ? 'block' : 'none';
    // step-specific extras
    paintOwnExtras(M.own);
    var sc = (P.stats && P.stats.scan) || [], wm = (P.stats && P.stats.watermark) || [];
    if (sc.length) paintStack('scan', [[sc[0][0], sc[0][1], 'var(--good)'], [sc[1][0], sc[1][1], 'var(--bad)'], [sc[2][0], sc[2][1], 'var(--muted)'], [sc[3][0], sc[3][1], 'var(--warn)']]);
    if (wm.length) paintStack('watermark', [['Logo on most photos (Y)', wm[0][1], 'var(--bad)'], ['Logo on one photo (P)', wm[1][1], 'var(--warn)'], ['No logo seen (N)', wm[2][1], 'var(--good)']]);
    // buttons
    var c = P.collector || {}, run = c.active, online = c.collectorOnline;
    setBtns('collect', run && online, false); if (btn.collect) { btn.collect['■ Stop'].disabled = !run; btn.collect['▶ Start collection'].disabled = !!(run && online); }
    ['dns', 'scan', 'wayback', 'watermark'].forEach(function(id){ setBtns(id, M[id].running, false); });
    setBtns('own', M.own.running, false);
    if (btn.watermark) { if (!P.wmEngine) btn.watermark['▶ Start'].disabled = true; if (btn.watermark['🔍 Dry run']) btn.watermark['🔍 Dry run'].style.display = P.wmEngine === 'local' ? 'none' : ''; }
    IDS.forEach(function(id){ running[id] = !!M[id].running; }); paintSpeed();
    // overview totals
    var cnt = P.counts || {}, own = M.own, ownTotal = (P.own && P.own.total) || 0;
    paintStats('ov_totals', [['Agencies', cnt.agents, 'info', null], ['With a website', cnt.withSite, 'info', cnt.agents], ['Agencies with an email', cnt.withEmail, 'good', cnt.agents],
      ['Own-website counted', last ? last.done : 0, 'good', ownTotal], ['Watermark checked', cnt.decisions, 'good', null], ['70+ sales and no watermark', cnt.over70NoWm, 'good', null]]);
    // scratch + alert bars
    var s = P.scratch, sb = $('scratchbar');
    if (s && s.active) { sb.style.display = 'block'; sb.innerHTML = s.phase === 'collect'
      ? '<b>Started from scratch · step 1 of 2:</b> collecting agencies and sale counts from Spiti24. Open the <b>1 · Spiti24</b> tab, copy the collector script and run it in your Chrome tab. When it has finished, the other stages start by themselves. The old data is backed up in <code>/data/backups/' + s.backup + '</code>.'
      : '<b>Started from scratch · step 2 of 2:</b> the server stages are running one after another (website check → emails → web archive → watermark check → own-website counts).'; }
    else if (s && s.phase === 'finished') { sb.style.display = 'block'; sb.innerHTML = '<b>Restart from scratch finished</b> (' + String(s.finishedAt || '').replace('T', ' ').slice(0, 16) + ' UTC). The Excel now holds the new data.'; }
    else sb.style.display = 'none';
    blockedNow = !!(c.lastBlock && run); if (blockedNow && !c.lastBlock.notified) alertBlock(c.lastBlock.at);        // the Spiti24 tab already showed its own notification when it could
    var ab = $('alertbar'); ab.style.display = blockedNow ? 'block' : 'none'; if (blockedNow) ab.innerHTML = '<b>Action needed:</b> Spiti24 stopped the collection. Click here to see what to do.';
    var ch = P.chain, ca = ch && ch.active; $('runall').disabled = !!ca; $('runall').innerHTML = ca ? '⏳ Running stages…' : '▶ Run all server stages';
    // header pill + page title
    var runningIds = IDS.filter(function(id){ return M[id].running; }), pill = $('pill'); pill.className = 'pill';
    if (failures > 1) { pill.classList.add('offline'); $('pilltxt').textContent = 'Offline · retrying'; }
    else if (blockedNow) { pill.classList.add('warn'); $('pilltxt').textContent = 'Action needed – Spiti24 stopped the collection'; }
    else if (last && last.draining) { pill.classList.add('warn'); $('pilltxt').textContent = 'Restarting (memory guard)'; }
    else if (runningIds.length) { $('pilltxt').textContent = 'Running · ' + runningIds.map(function(id){ return 'step ' + (IDS.indexOf(id) + 1); }).join(', '); }
    else { $('pilltxt').textContent = 'Idle – nothing running'; pill.classList.add('done'); }
    document.title = (blockedNow ? '⛔ Action needed · ' : '') + (runningIds.length ? Math.floor(M[runningIds[0]].pct) + '% · ' + STEPS[IDS.indexOf(runningIds[0])].tab : 'Agency site counter');
    if (last) $('foot').textContent = 'Memory: Node heap ' + fmtNum(last.heapMB) + ' MB · process ' + fmtNum(last.memoryMB) + ' MB · refreshes every 3 s · nothing on this page is stored';
  }

  // smooth per-second countdown between polls
  setInterval(function(){
    IDS.forEach(function(id){ var b = etaBase[id]; if (!b || failures > 1) return; var left = b.s - (Date.now() - b.at) / 1000; if (left >= 0) $(id + '_count').innerHTML = durHtml(left); });
  }, 1000);

  function poll(){
    fetch('/status', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' }).then(function(r){
      if (r.status === 401) { try { sessionStorage.removeItem('tok'); } catch(e){} location.search = ''; throw new Error('unauthorized'); }
      if (!r.ok) throw new Error('http ' + r.status); return r.json();
    }).then(function(d){
      failures = 0; $('banner').classList.remove('show'); last = d; fetchedAt = Date.now(); renderAll();
    }).catch(function(){ failures++; if (failures > 1) { $('banner').classList.add('show'); renderAll(); } })
    .then(function(){ setTimeout(poll, 3000); });
  }
  function pollPipe(){
    fetch('/pipeline/status', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if (j) { P = j; renderAll(); } }).catch(function(){});
  }
  buildUI(); show(location.hash.slice(1)); pollPipe(); setInterval(pollPipe, 3000); poll();
  // a hidden tab has its timers slowed down by Chrome; a worker keeps the check running so the block notification is not late
  try { var ticker = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},3000)']))); ticker.onmessage = function(){ if (document.hidden) pollPipe(); }; } catch (e) {}
})();

</script>
</body>
