appId: com.logiqdev.propertysync.crawler
productName: Property Sync Crawler
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
# playwright-core launches Chrome as a child process and reads its own files from disk; keep it
# outside the asar archive.
asarUnpack:
  - node_modules/playwright-core/**
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Property-Sync-Crawler-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Property Sync Crawler

# Makes electron-builder write release/latest.yml (version, file name, sha512) for the auto-updater.
# The url is only a placeholder: the app points the updater at its own API at runtime
# (src/main/updates/app-updater.ts), and api/scripts/publish-desktop-crawler.ts uploads the files.
publish:
  provider: generic
  url: https://updates.invalid/desktop-crawl/app/update
